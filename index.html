<title>Origo</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#1b3350;--mute:#5c6d83;--line:#dde5ea;--acc:#234366;--accbg:#e2eeea;--on:#fff;--ok:#3f8a72;--warn:#b0602d;--warnbg:#fbe9df;--bad:#b0433b;--badbg:#f8e1dd;--hero:#234366;--herot:#fff;--hm:rgba(255,255,255,.72);--hok:#8fbaad;--hwarn:#ecaf8e;--hbad:#ef8a7e;--c1:#234366;--c1t:#fff;--c2:#82ada0;--c3:#ecaf8e;--ct:#15294a;--moon:#234366;--mint:#82ada0;--peach:#ecaf8e}
[data-t=dark]{--bg:#0c1524;--card:#14223a;--ink:#d3dae4;--mute:#8393a8;--line:#1f2f48;--acc:#8fbaad;--accbg:#1a2f40;--on:#0c1524;--ok:#78b49d;--warn:#e0a07f;--warnbg:#2c2420;--bad:#e08b82;--badbg:#32201f;--hero:#1b3050;--herot:#d3dae4;--hm:rgba(211,218,228,.65);--hok:#6fae98;--hwarn:#d9906f;--hbad:#d77a70;--c1:#27466f;--c1t:#d3dae4;--c2:#5f9582;--c3:#c8805f;--ct:#0c1524;--moon:#7d9fcf;--mint:#5f9582;--peach:#d9906f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:0;font-weight:600}h2{font-size:17px;margin:18px 0 8px;font-weight:600}
.mute{color:var(--mute);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.val{font-size:20px;font-weight:600;margin:2px 0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--hok);width:0;transition:width .5s}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--accbg);color:var(--acc)}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
#qbar{position:fixed;left:0;right:0;bottom:calc(var(--nh,62px) + 0px);z-index:8;background:var(--bg);border-top:1px solid var(--line);padding:8px 14px}
#qbar .big{max-width:452px;margin:0 auto;gap:8px}
#qbar .big button{height:64px;min-height:56px;border-radius:16px;gap:2px;font-size:15px}
#qbar .big button svg{width:24px;height:24px}
body.qb #toast{bottom:calc(var(--nh,62px) + 84px)}
.qsp{height:96px}
.delb{flex:none;width:40px;height:40px;margin:0 -8px 0 2px;border:0;border-radius:10px;background:none;color:var(--mute);display:grid;place-items:center;padding:0}
.delb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.delb:active{background:var(--badbg);color:var(--bad)}
.emb{text-align:left}.emb .cd{font-size:44px;font-weight:700;line-height:1.1;margin:2px 0}.emb .tip{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);font-size:15px}
.big button{height:104px;border-radius:18px;border:0;background:var(--acc);color:var(--on);font-weight:600;font-size:16px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.big button svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.big button:active{transform:scale(.96)}
.big button.run{background:var(--ok)}
button.sec{background:var(--accbg);color:var(--acc);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
button.sec.bad{background:var(--badbg);color:var(--bad)}
button.lnk{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;padding:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;font:inherit;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--acc);font-weight:600}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ban{display:none;position:sticky;top:0;z-index:5;background:var(--c1);color:var(--c1t);padding:10px 14px;font-weight:600;justify-content:space-between;align-items:center}
#ban button{background:var(--c3);color:var(--ct);border:0;border-radius:8px;padding:6px 12px;font:inherit;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 10px}
label{font-size:13px;color:var(--mute)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:flex-end}
#sh{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.chips{display:flex;gap:8px;margin:6px 0 12px}.chips button{flex:1;padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.chips button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));max-width:456px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;z-index:40;justify-content:space-between;align-items:center}
#toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline}
.day{margin:16px 0 6px;font-weight:600;font-size:14px;color:var(--mute)}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.brand{display:flex;align-items:center;gap:12px}.brand img{display:block;width:auto}[data-t=dark] .brand{display:inline-flex;background:#f4f7f8;border-radius:14px;padding:6px 14px}
.hero{background:var(--hero);color:var(--herot)}.hero .mute{color:var(--hm)}.hero .bar{background:rgba(255,255,255,.18)}
.big #bT{background:var(--c1);color:var(--c1t)}.big #bP{background:var(--c2);color:var(--ct)}.big #bS{background:var(--c3);color:var(--ct)}.big #bS.run{background:var(--c1);color:var(--c3)}
.it.dn span:first-child{text-decoration:line-through;opacity:.55}
.rt{width:100%;border-collapse:collapse;font-size:14px}.rt td,.rt th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.rt th{color:var(--mute);font-weight:600;font-size:12px}
#rep{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:14px}
.repbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 auto 10px;max-width:480px}.repbar span{display:flex;gap:6px}.repbar button{padding:10px 12px}#repb{max-width:480px;margin:0 auto 30px}#repb h2{font-size:16px;margin:18px 0 6px}
button.sec.on{background:var(--acc);color:var(--on)}
@media print{:root,[data-t=dark]{--bg:#fff;--card:#fff;--ink:#111;--mute:#555;--line:#ccc;--acc:#234366;--mint:#3f8a72}body>*:not(#rep){display:none!important}#rep{position:static;display:block!important;padding:0;overflow:visible}.repbar{display:none}#repb{max-width:none}}
textarea{min-height:90px;resize:vertical}
details>summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;list-style:none;padding:4px 0}details>summary::-webkit-details-marker{display:none}details[open]>summary{margin-bottom:4px}
.bl{font-size:14px;margin:4px 0;color:var(--ink)}
:root{--t1:#e4eaf2;--t2:#e2eeea;--t3:#fbece3}[data-t=dark]{--t1:#1d2f4a;--t2:#1c3532;--t3:#33261f}
main{padding:16px}h1{letter-spacing:-.01em}
.card{box-shadow:0 1px 2px rgba(35,67,102,.05),0 6px 18px rgba(35,67,102,.04)}[data-t=dark] .card{box-shadow:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.av{width:48px;height:48px;border-radius:50%;border:0;background:var(--accbg);color:var(--acc);font-weight:700;font-size:20px;font-family:inherit;flex:none}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;margin-right:12px}.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gf{background:var(--t1);color:var(--acc)}.gp{background:var(--t2);color:var(--ok)}.gs,.gm{background:var(--t3);color:var(--warn)}.gh,.g0{background:var(--accbg);color:var(--acc)}
.it.ev,.it.mi{cursor:pointer}.it.ev:active,.it.mi:active{opacity:.7}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16)}.hrow b{font-size:17px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.sum b{display:block;font-size:22px;font-weight:600}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}.pg button{height:76px;border-radius:16px;border:0;background:var(--accbg);color:var(--acc);font-weight:600;font-size:18px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.pg button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pg button:active{transform:scale(.97)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-right:12px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}#sh{animation:up .22s ease}
@media (max-width:359px){.brand{gap:8px}.brand img:first-child{height:36px}.brand img:last-child{height:17px}[data-t=dark] .brand{padding:5px 10px}.top .sec{padding:8px 10px!important}main{padding:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tl{border-left:2px solid var(--line);margin:8px 0 0 6px;padding-left:18px}.tli{position:relative;cursor:pointer}.tld{position:absolute;left:-24px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}.tl .day{margin-top:6px}

/* ===== Escena: fondo ilustrado según la luz del día (Hoy) ===== */
:root{--nh:72px}
#scene{display:none;position:absolute;top:0;left:0;right:0;margin:0 auto;max-width:640px;aspect-ratio:1438/2576;background:center top/cover no-repeat;z-index:0;pointer-events:none}
@media (min-width:641px){#scene{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}}
body.scn #scene{display:block}body.scn main{position:relative;z-index:1}
[data-f=noche]{--sb:#091523;--st:#071629;--nm:#fff;--nm2:rgba(196,220,245,.88);--hf:brightness(0) invert(1);--gb:rgba(20,44,82,.7);--gc:#fff;--img:url(assets/escena-noche.jpg)}
[data-f=amanecer]{--sb:#113149;--st:#96caed;--nm:#15325a;--nm2:rgba(21,50,90,.78);--hf:none;--gb:rgba(255,255,255,.6);--gc:#1b3a63;--img:url(assets/escena-amanecer.jpg)}
[data-f=dia]{--sb:#0d244c;--st:#2a9ded;--nm:#fff;--nm2:#fff;--hf:brightness(0) invert(1);--gb:rgba(255,255,255,.28);--gc:#fff;--img:url(assets/escena-dia.jpg)}
[data-f=atardecer]{--sb:#1d1841;--st:#5d3180;--nm:#fff;--nm2:rgba(255,232,214,.9);--hf:brightness(0) invert(1);--gb:rgba(40,24,80,.55);--gc:#fff;--img:url(assets/escena-atardecer.jpg)}

<script>
/* ===== Conexión con Firebase =====
   PEGA AQUÍ la configuración de tu proyecto (Firebase → Configuración del proyecto → Tus apps → firebaseConfig).
   Si se deja en null, Origo funciona solo en este dispositivo, como antes. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAxUM02XzYX_iZD4L21PVo2LD_DN3gL2ws",
  authDomain: "origo-5ae53.firebaseapp.com",
  projectId: "origo-5ae53",
  storageBucket: "origo-5ae53.firebasestorage.app",
  messagingSenderId: "444810857322",
  appId: "1:444810857322:web:5c9ed8e74dc807f717b313"
};

/* ===== Capa de datos =====
   localStorage es la copia local; con Firebase, add() y patch() además envían el registro a Firestore
   (ver bloque "Sincronización con Firebase"). */
const Store={
  ev:JSON.parse(localStorage.getItem('bebe.ev')||'[]'),
  save(){localStorage.setItem('bebe.ev',JSON.stringify(this.ev));render()},
  add(e){e.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);e.borrado=false;if(Sync.on&&Sync.uid)e.por=Sync.uid;this.ev.push(e);this.save();pushEv(e);return e},
  patch(id,p){const e=this.ev.find(e=>e.id===id);Object.assign(e,p);this.save();pushEv(e)},
  live(){return this.ev.filter(e=>!e.borrado).sort((a,b)=>b.inicio-a.inicio)}
};
let cfg=JSON.parse(localStorage.getItem('bebe.cfg')||'{}');
const saveCfg=()=>{localStorage.setItem('bebe.cfg',JSON.stringify(cfg));pushCfg()};

/* ===== Sincronización con Firebase (Firestore + Auth) =====
   Si FIREBASE_CONFIG está vacío, la app funciona como antes: solo en este dispositivo.
   Con Firebase:
   - localStorage sigue siendo la copia local (la app abre al instante y funciona sin conexión).
   - Firestore guarda familias/{código} (miembros, nombres, cfg) con las subcolecciones
     eventos/{id} y fotos/{id}. Las escrituras sin conexión quedan en cola y se envían solas.
   - Cada evento guarda "por" (UID de quien lo registró). */
const FB_V='12.0.0',FB_URL=m=>'https://www.gstatic.com/firebasejs/'+FB_V+'/firebase-'+m+'.js';
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(_){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const Sync={
  on:!!(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey),ready:false,gate:false,uid:LS.get('origo.uid',null),fid:LS.get('origo.fid',null),
  email:LS.get('origo.email',''),miembros:LS.get('origo.miem',[]),nombres:LS.get('origo.nom',{}),estado:'Conectando…',
  pend:new Set(LS.get('origo.pend',[])),fotKnown:new Set(),askedFot:new Set(),F:null,db:null,auth:null,unsub:[],firstFam:false
};
const savePend=()=>LS.set('origo.pend',[...Sync.pend]);
/* Quién hizo un registro (solo se muestra si la familia tiene más de un miembro) */
function quien(e){if(!Sync.on||!e||!e.por||Sync.miembros.length<2)return'';const n=(Sync.nombres[e.por]||'').trim().split(/\s+/)[0];return n?n.slice(0,14):''}
/* Redibuja sin interrumpir a quien está escribiendo en un campo */
let rPend=false;
function softRender(){const a=document.activeElement;if(a&&$('app').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){if(!rPend){rPend=true;a.addEventListener('blur',()=>{rPend=false;setTimeout(render,0)},{once:true})}return}render()}

/* --- cfg: cada clave se guarda como texto JSON; los objetos simples (stock, vacs, hitos…) por subclave,
   así dos móviles pueden cambiar cosas distintas a la vez sin pisarse --- */
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
function encCfg(c){const o={};for(const k in c){const v=c[k];if(v===undefined)continue;if(isObj(v)){o[k]={};for(const s in v)if(v[s]!==undefined)o[k][s]=JSON.stringify(v[s])}else o[k]=JSON.stringify(v)}return o}
function decCfg(o){const c={};for(const k in o||{}){const v=o[k];if(typeof v==='string'){try{c[k]=JSON.parse(v)}catch(_){}}else if(isObj(v)){c[k]={};for(const s in v){try{c[k][s]=JSON.parse(v[s])}catch(_){}}}}return c}
const SEP='\u0001';
function flat(E){const f={};for(const k in E||{}){const v=E[k];if(typeof v==='string')f[k]=v;else if(isObj(v)){f[k]='\u0002';for(const s in v)f[k+SEP+s]=v[s]}}return f}
function unflat(f){const E={};for(const p in f)if(!p.includes(SEP))E[p]=f[p]==='\u0002'?{}:f[p];for(const p in f)if(p.includes(SEP)){const[k,s]=p.split(SEP);if(isObj(E[k]))E[k][s]=f[p]}return E}
function diffCfg(A,B){const ops=[];const K=new Set([...Object.keys(A||{}),...Object.keys(B||{})]);
  K.forEach(k=>{const a=(A||{})[k],b=(B||{})[k];
    if(b===undefined){if(a!==undefined)ops.push([[k],null])}
    else if(typeof b==='string'){if(a!==b)ops.push([[k],b])}
    else if(a===undefined&&Object.keys(b).length)Object.keys(b).forEach(s=>ops.push([[k,s],b[s]]));
    else if(!isObj(a))ops.push([[k],b]);
    else{new Set([...Object.keys(a),...Object.keys(b)]).forEach(s=>{if(a[s]!==b[s])ops.push([[k,s],b[s]===undefined?null:b[s]])})}});
  return ops}
function pushCfg(){
  if(!Sync.ready)return;const B=LS.get('origo.base',{}),L=encCfg(cfg),ops=diffCfg(B,L);if(!ops.length)return;
  const F=Sync.F,args=[];ops.forEach(([p,v])=>{args.push(new F.FieldPath('cfg',...p),v===null?F.deleteField():v)});
  LS.set('origo.base',L);
  F.updateDoc(F.doc(Sync.db,'familias',Sync.fid),...args).catch(fbErr);
}
/* Mezcla a tres bandas: lo que cambió en remoto se aplica; lo que cambió aquí se envía */
function mergeCfg(R){
  const B=flat(LS.get('origo.base',{})),Rf=flat(R),Lf=flat(encCfg(cfg)),M={};
  new Set([...Object.keys(B),...Object.keys(Rf),...Object.keys(Lf)]).forEach(p=>{const v=Rf[p]!==B[p]?Rf[p]:Lf[p];if(v!==undefined)M[p]=v});
  const ME=unflat(M),nc=decCfg(ME),old=JSON.stringify(cfg);let ch=false;
  Object.keys(cfg).forEach(k=>{if(!(k in nc)){delete cfg[k];ch=true}});
  Object.keys(nc).forEach(k=>{if(JSON.stringify(cfg[k])!==JSON.stringify(nc[k])){cfg[k]=nc[k];ch=true}});
  localStorage.setItem('bebe.cfg',JSON.stringify(cfg));
  LS.set('origo.base',R);pushCfg();
  return ch&&old!==JSON.stringify(cfg);
}

/* --- eventos --- */
function evDoc(e){const F=Sync.F;return{tipo:e.tipo,inicio:e.inicio,borrado:!!e.borrado,por:e.por||null,j:JSON.stringify(e),act:F.serverTimestamp()}}
function pushEv(e){
  if(!Sync.on)return;
  if(!Sync.ready){Sync.pend.add(e.id);savePend();return}
  const F=Sync.F;F.setDoc(F.doc(Sync.db,'familias',Sync.fid,'eventos',e.id),evDoc(e)).catch(fbErr);
}
async function pushMany(list){const F=Sync.F;for(let i=0;i<list.length;i+=400){const b=F.writeBatch(Sync.db);list.slice(i,i+400).forEach(e=>b.set(F.doc(Sync.db,'familias',Sync.fid,'eventos',e.id),evDoc(e)));await b.commit()}}
/* Sustituye todos los registros (Importar): los que no vienen en la copia quedan borrados */
function replaceAll(nuevos){
  const ids=new Set(nuevos.map(e=>e.id)),fuera=Store.ev.filter(e=>!ids.has(e.id)).map(e=>Object.assign({},e,{borrado:true}));
  Store.ev=nuevos;
  if(Sync.on){if(Sync.ready)pushMany(fuera.concat(nuevos)).catch(fbErr);else{fuera.concat(nuevos).forEach(e=>Sync.pend.add(e.id));Store.ev=nuevos.concat(fuera);savePend()}}
  Store.save();
}

/* --- fotos: se descargan al verlas y quedan en la caché de Firestore (sirve sin conexión) --- */
function fotProxy(o){return new Proxy(o,{get(t,k){
  if(typeof k==='string'&&!(k in t)&&Sync.ready&&/^f[0-9a-z]+$/.test(k)&&!Sync.askedFot.has(k)){Sync.askedFot.add(k);const F=Sync.F,r=F.doc(Sync.db,'familias',Sync.fid,'fotos',k);
    F.getDocFromCache(r).catch(()=>F.getDoc(r)).then(s=>{if(s&&s.exists()){t[k]=s.data().d;Sync.fotKnown.add(k);softRender()}}).catch(()=>Sync.askedFot.delete(k))}
  return t[k]}})}
function syncFot(){
  const F=Sync.F;let ok=true;
  Object.keys(FOT).forEach(k=>{if(Sync.fotKnown.has(k))return;if(String(FOT[k]).length>950000){ok=false;return}
    Sync.fotKnown.add(k);F.setDoc(F.doc(Sync.db,'familias',Sync.fid,'fotos',k),{d:FOT[k],act:F.serverTimestamp()}).catch(fbErr)});
  [...Sync.fotKnown].forEach(k=>{if(!(k in FOT)){Sync.fotKnown.delete(k);F.deleteDoc(F.doc(Sync.db,'familias',Sync.fid,'fotos',k)).catch(fbErr)}});
  localStorage.removeItem('bebe.fotos');return ok;
}
async function todasFotos(){if(!Sync.ready)return;const F=Sync.F,q=await F.getDocs(F.collection(Sync.db,'familias',Sync.fid,'fotos'));q.forEach(s=>{if(!(s.id in FOT))FOT[s.id]=s.data().d;Sync.fotKnown.add(s.id)})}

/* --- errores y estado --- */
function fbErr(err){const c=err&&err.code||'';console.warn('Firebase',c,err&&err.message);
  Sync.estado=c.includes('permission')?'Sin permiso: revisa las reglas o el código de familia':c.includes('unavailable')?'Sin conexión: se enviará al volver':'Error de sincronización';
  if(c.includes('permission'))toast(Sync.estado,null)}
function authMsg(c){return({'auth/invalid-email':'El correo no es válido','auth/missing-password':'Escribe la contraseña','auth/weak-password':'La contraseña debe tener al menos 6 caracteres','auth/email-already-in-use':'Ese correo ya tiene cuenta: pulsa Entrar','auth/invalid-credential':'Correo o contraseña incorrectos','auth/wrong-password':'Correo o contraseña incorrectos','auth/user-not-found':'No hay ninguna cuenta con ese correo','auth/too-many-requests':'Demasiados intentos. Espera un poco','auth/network-request-failed':'Sin conexión a internet'})[c]||'No se pudo completar ('+(c||'error')+')'}

/* --- pantallas de acceso (no se pueden cerrar hasta terminar) --- */
function gate(html){Sync.gate=true;$('sh').innerHTML='<div style="text-align:center;margin-bottom:8px"><span style="display:inline-block;background:#f4f7f8;border-radius:16px;padding:10px 18px">'+LOGO(110)+'</span></div>'+html+'<div class="mute" id="gm" style="min-height:20px;margin-top:8px;color:var(--bad)"></div>';$('ov').style.display='flex';$('toast').style.display='none'}
const gmsg=t=>{if($('gm'))$('gm').textContent=t};
function endGate(){Sync.gate=false;closeSheet();checkOnboard()}
function checkOnboard(){if(Sync.firstFam&&!Sync.gate&&!cfg.nombre&&$('ov').style.display!=='flex')onboard()}
const busy=(id,on)=>{const b=$(id);if(b){b.disabled=on;b.style.opacity=on?.5:1}};
function gateLogin(){
  gate('<h2 style="margin-top:0;text-align:center">Entrar en Origo</h2><div class="mute" style="text-align:center;margin-bottom:6px">Con una cuenta, los registros se comparten entre los móviles de la familia.</div><button class="sec" id="lg" style="width:100%;margin:6px 0 4px;background:var(--acc);color:var(--on);display:flex;align-items:center;justify-content:center"><span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#fff;margin-right:10px;flex:none" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span>Entrar con Google</button><div class="mute" style="text-align:center;margin:8px 0 0">o con correo y contraseña</div><label>Correo</label><input id="le" type="email" autocomplete="email" value="'+esc(Sync.email)+'"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password"><div class="grid" style="margin-top:6px"><button class="sec" id="lc">Crear cuenta</button><button class="sec" id="li">Entrar</button></div><button class="sec" id="lr" style="width:100%;margin-top:10px;background:none">He olvidado la contraseña</button>');
  const F=Sync.F,go=(fn,id)=>async()=>{const e=$('le').value.trim(),p=$('lp').value;gmsg('');busy(id,true);try{Sync.email=e;LS.set('origo.email',e);await fn(Sync.auth,e,p)}catch(x){gmsg(authMsg(x.code))}busy(id,false)};
  $('li').onclick=go(F.signInWithEmailAndPassword,'li');$('lc').onclick=go(F.createUserWithEmailAndPassword,'lc');
  $('lg').onclick=async()=>{gmsg('');const pr=()=>{const p=new F.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return p};busy('lg',true);
    try{await F.signInWithPopup(Sync.auth,pr())}
    catch(x){const c=x.code||'';if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{await F.signInWithRedirect(Sync.auth,pr())}catch(y){gmsg(authMsg(y.code))}}
      else if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request')gmsg(c==='auth/operation-not-allowed'?'Falta activar Google en Firebase (Authentication → Método de acceso)':c==='auth/unauthorized-domain'?'Falta añadir este dominio en Firebase (Authentication → Dominios autorizados)':authMsg(c))}
    busy('lg',false)};
  $('lr').onclick=async()=>{const e=$('le').value.trim();if(!e)return gmsg('Escribe tu correo arriba');try{await F.sendPasswordResetEmail(Sync.auth,e);gmsg('Te hemos enviado un correo para cambiarla')}catch(x){gmsg(authMsg(x.code))}};
}
const ALF='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const nuevoCod=()=>{const a=new Uint32Array(8);crypto.getRandomValues(a);return[...a].map(n=>ALF[n%32]).join('')};
const fmtCod=c=>String(c||'').slice(0,4)+'-'+String(c||'').slice(4);
const conTiempo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),ms))]);
function gateFamilia(){
  const hay=Store.ev.length>0||!!cfg.nombre;
  gate('<h2 style="margin-top:0;text-align:center">Tu familia</h2><label>Tu nombre (se verá en cada registro)</label><input id="gn" placeholder="Por ejemplo, Iván" value="'+esc(Sync.nombres[Sync.uid]||'')+'">'+
    '<div class="card" style="background:var(--bg);margin-top:8px"><b>Soy el primero</b><div class="mute" style="margin:4px 0 10px">Crea la familia'+(hay?' y sube los datos que ya hay en este móvil':'')+'. Después invitarás al otro progenitor con un código.</div><button class="sec" id="gc" style="width:100%;background:var(--acc);color:var(--on)">Crear familia</button></div>'+

/* --- conexión: escuchar cambios de la familia y de los registros --- */
async function arrancar(fid,subirTodo){
  const F=Sync.F,db=Sync.db;Sync.fid=fid;LS.set('origo.fid',fid);
  Sync.ready=true;Sync.estado='Sincronizado';
  if(subirTodo)pushMany(Store.ev).catch(fbErr);
  else if(Sync.pend.size)pushMany(Store.ev.filter(e=>Sync.pend.has(e.id))).catch(fbErr);
  Sync.pend.clear();savePend();syncFot();
  Sync.unsub.forEach(u=>u());Sync.unsub=[];
  Sync.unsub.push(F.onSnapshot(F.doc(db,'familias',fid),s=>{
    if(!s.exists())return;const d=s.data();Sync.miembros=d.miembros||[];Sync.nombres=d.nombres||{};LS.set('origo.miem',Sync.miembros);LS.set('origo.nom',Sync.nombres);
    mergeCfg(d.cfg||{});theme();softRender();
    if(!Sync.firstFam){Sync.firstFam=true;checkOnboard()}
  },e=>{fbErr(e);if(String(e.code).includes('permission')&&!Sync.gate){Sync.ready=false;gateFamilia()}}));
  const desde=Math.max(0,LS.get('origo.seen',0)-120000);
  Sync.unsub.push(F.onSnapshot(F.query(F.collection(db,'familias',fid,'eventos'),F.where('act','>',F.Timestamp.fromMillis(desde))),q=>{
    let seen=LS.get('origo.seen',0),ch=false;
    q.docChanges().forEach(c=>{if(c.type==='removed')return;const d=c.doc.data();let e;try{e=JSON.parse(d.j)}catch(_){return}e.id=c.doc.id;
      const cur=Store.ev.find(x=>x.id===e.id),je=JSON.stringify(e);
      if(!cur){Store.ev.push(e);ch=true}else if(JSON.stringify(cur)!==je){Object.keys(cur).forEach(k=>{if(!(k in e))delete cur[k]});Object.assign(cur,e);ch=true}
      if(!c.doc.metadata.hasPendingWrites&&d.act&&d.act.toMillis)seen=Math.max(seen,d.act.toMillis())});
    LS.set('origo.seen',seen);Sync.estado=q.metadata.fromCache?'Sin conexión: se enviará al volver':'Sincronizado';
    if(ch){localStorage.setItem('bebe.ev',JSON.stringify(Store.ev));softRender()}
  },fbErr));
}
async function iniciarFirebase(){
  if(!Sync.on)return;
  try{
    const[A,AU,FS]=await Promise.all(['app','auth','firestore'].map(m=>import(FB_URL(m))));
    Sync.F=Object.assign({},A,AU,FS);const F=Sync.F,app=F.initializeApp(FIREBASE_CONFIG);
    Sync.auth=F.getAuth(app);
    try{Sync.db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()}),ignoreUndefinedProperties:true})}
    catch(_){Sync.db=F.getFirestore(app)}
    F.onAuthStateChanged(Sync.auth,async u=>{
      if(!u){Sync.ready=false;if(Sync.uid&&Sync.fid){Sync.uid=null;return salir()}return gateLogin()}
      if(Sync.uid&&Sync.uid!==u.uid){Object.keys(localStorage).filter(k=>/^(bebe|origo)\./.test(k)&&k!=='origo.email').forEach(k=>localStorage.removeItem(k));location.reload();return}
      Sync.uid=u.uid;LS.set('origo.uid',u.uid);if(u.email){Sync.email=u.email;LS.set('origo.email',u.email)}Store.ev.forEach(e=>{if(!e.por&&!Sync.fid)e.por=u.uid});
      let fid=Sync.fid;
      if(!fid){try{const s=await F.getDoc(F.doc(Sync.db,'usuarios',u.uid));fid=s.exists()&&s.data().fid}catch(_){}}
      if(!fid){endGate();return gateFamilia()}
      if(Sync.gate)endGate();
      await arrancar(fid,false);softRender();
    });
  }catch(err){console.warn('Firebase no disponible',err);Sync.estado='Sin conexión: se enviará al volver';
    if(!Sync.fid)gate('<h2 style="margin-top:0;text-align:center">Sin conexión</h2><div class="mute" style="text-align:center">La primera vez Origo necesita internet para entrar en tu cuenta.</div><button class="sec" style="width:100%;margin-top:10px" onclick="location.reload()">Reintentar</button>');
    window.addEventListener('online',()=>location.reload(),{once:true})}
}


/* ===== Ventanas de vigilia orientativas (minutos) por edad en meses ===== */
function ventana(m){
  if(m<2)return[35,60];if(m===2)return[60,90];if(m===3)return[75,105];
  if(m<6)return[90,150];if(m<9)return[120,180];return[180,240];
}

function dur(ms){const m=Math.max(0,Math.floor(ms/60000));return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'}
function clock(ms){const s=Math.max(0,Math.floor(ms/1000));return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function ageM(){if(!cfg.nac)return 0;const a=new Date(cfg.nac),b=new Date();let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return Math.max(0,m)}
function ageTxt(){if(!cfg.nac)return'';const d=Math.floor((Date.now()-new Date(cfg.nac))/864e5),m=ageM();if(d<0)return'Aún no ha nacido';if(m<1)return d+' días';return m+(m===1?' mes':' meses')+' · '+Math.floor((d-m*30.4)/7)+' sem.'}
function toTs(hhmm){const[h,m]=hhmm.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);if(d>Date.now()+6e4)d.setDate(d.getDate()-1);return d.getTime()}

/* ===== Tema (automático: noche de 21:00 a 07:00) ===== */
/* Fase del día según la salida y puesta del sol (aproximación para Andalucía, lat. 37,4 · long. -5) */
function sol(d=new Date()){const n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),g=2*Math.PI/365*(n-1),R=Math.PI/180,lat=37.4*R,lon=-5;
  const eq=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
  const de=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
  const ha=Math.acos(Math.cos(90.833*R)/(Math.cos(lat)*Math.cos(de))-Math.tan(lat)*Math.tan(de))/R,tz=-d.getTimezoneOffset();
  return[720-4*(lon+ha)-eq+tz,720-4*(lon-ha)-eq+tz]}
let faseFija=null;
function fase(){if(faseFija)return faseFija;const d=new Date(),m=d.getHours()*60+d.getMinutes(),[a,p]=sol(d);
  return m>=a-30&&m<a+90?'amanecer':m>=a+90&&m<p-75?'dia':m>=p-75&&m<p+30?'atardecer':'noche'}
function theme(){const f=fase(),t=cfg.tema||'auto';document.documentElement.dataset.f=f;
  const dark=t==='noche'||(t==='auto'&&f==='noche');
  document.documentElement.dataset.t=dark?'dark':'light';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=document.body.classList.contains('scn')?getComputedStyle(document.documentElement).getPropertyValue('--st').trim():dark?'#0c1524':'#f4f7f8'}

function renderNav(){$('nav').innerHTML=[['hoy','Hoy'],['his','Registros'],['cre','Salud'],['mas','Más']].map(([k,l])=>'<button data-k="'+k+'" class="'+(k===tab?'on':'')+'">'+ico[k]+l+'</button>').join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;render()})}

function state(){
  const L=Store.live(),t0=dayStart();
  const tomas=L.filter(e=>e.tipo==='toma'),pan=L.filter(e=>e.tipo==='panal'&&e.inicio>=t0);
  return{L,last:tomas[0],tomasHoy:tomas.filter(e=>e.inicio>=t0),pan,
    lastPan:L.find(e=>e.tipo==='panal'),S:L.find(e=>e.tipo==='sueno'&&!e.fin),lastSleep:L.find(e=>e.tipo==='sueno'&&e.fin)};
}

/* vCre: ver bloque de curvas OMS más abajo */
function vAju(){
  return'<h1>Ajustes</h1><div class="card" style="margin-top:12px"><label>Nombre</label><input id="cn" value="'+esc(cfg.nombre)+'"><label>Fecha de nacimiento</label><input id="cf" type="date" value="'+esc(cfg.nac)+'"><label>Sexo (curvas de la OMS)</label>'+chips('cx',[['f','Niña'],['m','Niño']],cfg.sexo)+'<label>Tema</label>'+chips('ct',[['auto','Auto (según la luz)'],['claro','Claro'],['noche','Noche']],cfg.tema||'auto')+'<button class="sec" id="cs" style="width:100%">Guardar ajustes</button></div>'+
  vFam()+'<h2>Copia de seguridad</h2><div class="card"><div class="mute" style="margin-bottom:10px">'+(Sync.on?'Los datos se comparten entre los móviles de la familia. Aun así, exporta una copia de vez en cuando.':'Los datos viven solo en este dispositivo. Haz copias de vez en cuando.')+'</div><div class="grid"><button class="sec" id="ex">Exportar</button><button class="sec" id="im">Importar</button></div><input type="file" id="fi" accept=".json" style="display:none"></div>'+
  '<button class="sec bad" id="rs" style="width:100%">Borrar todos los datos</button>';
}

function bind(){
  if(tab==='hoy'&&$('bT')){$('bT').onclick=sheetToma;$('bP').onclick=panelPanal;$('bS').onclick=panelSueno}
  if(tab==='his'&&$('hd'))$('hd').onchange=e=>{dia=e.target.value;render()};
  if(tab==='cre'&&$('addM'))$('addM').onclick=()=>ACT.medidas();
  if(tab==='mas'&&masSub==='aju'){
    if(Sync.ready&&!Sync.fotTodas){Sync.fotTodas=true;todasFotos().catch(()=>{Sync.fotTodas=false})}
    if($('fcp'))$('fcp').onclick=()=>{const c=fmtCod(Sync.fid);(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('Código copiado: '+c,null),()=>toast('Código: '+c,null))};
    if($('fso'))$('fso').onclick=()=>sheet('<h2 style="margin-top:0">¿Cerrar sesión?</h2><div class="mute" style="margin-bottom:12px">Los datos siguen guardados en la familia. Para volver, entra con tu correo y contraseña.</div>',()=>{salir()});
    $('cs').onclick=()=>{cfg.nombre=$('cn').value.trim();cfg.nac=$('cf').value;if(!nacFut())delete cfg.emb;cfg.sexo=chipVal('cx')||cfg.sexo;cfg.tema=chipVal('ct');saveCfg();theme();render();toast('Ajustes guardados',null)};
    $('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({cfg,ev:Store.ev,fotos:Object.assign({},FOT)})],{type:'application/json'}));a.download='bebe-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
    $('im').onclick=()=>$('fi').click();
    $('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.ev))throw 0;cfg=j.cfg||{};saveCfg();if(j.fotos){Object.keys(FOT).forEach(k=>delete FOT[k]);Object.assign(FOT,j.fotos);saveFot()}replaceAll(j.ev);theme();toast('Copia importada',null)}catch(_){toast('Archivo no válido',null)}};r.readAsText(f)};
    $('rs').onclick=()=>sheet('<h2 style="margin-top:0">¿Borrar todo?</h2><div class="mute" style="margin-bottom:12px">Se eliminarán todos los registros'+(Sync.on?' en todos los móviles de la familia':' de este dispositivo')+'. No se puede deshacer.</div>',()=>{
      if(Sync.on){Store.ev.forEach(e=>e.borrado=true);if(Sync.ready)pushMany(Store.ev).catch(fbErr);else{Store.ev.forEach(e=>Sync.pend.add(e.id));savePend()}}else Store.ev=[];
      Object.keys(cfg).forEach(k=>delete cfg[k]);const limpiar=()=>{Object.keys(FOT).forEach(k=>delete FOT[k]);saveFot()};limpiar();if(Sync.ready)todasFotos().then(limpiar,()=>{});
      saveCfg();Store.save();onboard()});
  }
}

function render(){
  document.body.classList.toggle('scn',tab==='hoy');
  $('app').innerHTML=(tab==='hoy'?'':brand())+{hoy:vHoy,his:vHis,cre:vSalud,mas:vMas}[tab]();
  renderNav();theme();document.documentElement.style.setProperty('--nh',$('nav').offsetHeight+'px');document.body.classList.toggle('qb',!!$('qbar'));bind();tick();
}

/* ===== Salud: temperatura, pauta del pediatra, citas y vacunas ===== */
/* Calendario sistemático de Andalucía 2026 (Instrucción DGSPyOF-1/2026, andavac.es): hexavalente 2-4-11 · neumococo VNC20 2-4-6-11 · meningococo B 2-4-15 ·
   meningococo ACWY 4 y 12 · rotavirus 2 y 4 · triple vírica 12 m y 2 años · varicela 15 m y 2 años. El id de cada dosis es 'v'+mes (las ya anotadas se conservan). */
const VAC=[[2,'Hexavalente, neumococo, meningococo B y rotavirus'],[4,'Hexavalente, neumococo, meningococo B, meningococo ACWY y rotavirus'],[6,'Neumococo'],[11,'Hexavalente y neumococo'],[12,'Triple vírica y meningococo ACWY'],[15,'Meningococo B y varicela'],[24,'Triple vírica y varicela']];
/* ===== Más: preparativos y stock de pañales ===== */
const ACT={
  temp(){sheet('<h2 style="margin-top:0">Temperatura</h2><label>Grados (°C)</label><input id="tc" type="number" step="0.1" inputmode="decimal"><label>Hora</label><input id="hr" type="time" value="'+nowHM()+'">',()=>{const c=+$('tc').value;if(!c||c<30||c>43)return false;addEv('temp',{c},toTs($('hr').value),'Temperatura registrada')})},
  dosis(){const i=pautaInfo(),go=()=>addEv('med',{farmaco:i.p.farmaco,ml:i.p.ml},0,'Dosis registrada');
    if(i.ok)go();else sheet('<h2 style="margin-top:0">¿Registrar igualmente?</h2><div class="mute" style="margin-bottom:12px">Según la pauta aún no toca (próxima a las '+hm(i.next)+'). Registra solo si ya se la has dado.</div>',()=>{go()})},
  pauta(){const p=cfg.pauta||{};sheet('<h2 style="margin-top:0">Pauta del pediatra</h2><div class="mute" style="margin-bottom:8px">Copia exactamente lo que te indicó. La app no calcula dosis.</div><label>Fármaco</label><input id="pf" value="'+esc(p.farmaco)+'"><label>Dosis (ml)</label><input id="pm" type="number" step="0.1" inputmode="decimal" value="'+esc(p.ml)+'"><label>Mínimo de horas entre dosis</label><input id="ph" type="number" inputmode="decimal" value="'+esc(p.horas)+'"><label>Máximo de dosis en 24 h</label><input id="px" type="number" inputmode="numeric" value="'+esc(p.max)+'"><label>Quién la indicó</label><input id="pd" value="'+esc(p.medico)+'">',()=>{
    const q={farmaco:$('pf').value.trim(),ml:+$('pm').value,horas:+$('ph').value,max:+$('px').value,medico:$('pd').value.trim()};
    if(!q.farmaco||!q.ml||!q.horas||!q.max)return false;cfg.pauta=q;saveCfg();render()})},
  cita(){sheet('<h2 style="margin-top:0">Nueva cita</h2><label>Tipo</label><select id="ct2"><option>Vacuna</option><option>Revisión del niño sano</option><option>Otra consulta</option></select><label>Fecha y hora</label><input id="cf2" type="datetime-local"><label>Dudas para el médico</label><input id="cp">',()=>{
    if(!$('cf2').value)return false;cfg.citas=(cfg.citas||[]).concat({id:Date.now().toString(36),t:$('ct2').value,f:$('cf2').value,p:$('cp').value.trim()});saveCfg();render()})},
  cdel(id){cfg.citas=cfg.citas.filter(c=>c.id!==id);saveCfg();render()},
  vac(m){cfg.vd=cfg.vd||{};cfg.vd[m]=!cfg.vd[m];saveCfg();render()},
  prc(id){const x=prep().find(p=>p.id===id);x.s={pend:'comp',comp:'reg',reg:'pend'}[x.s];saveCfg();render()},
  pdel(id){cfg.prep=prep().filter(p=>p.id!==id);saveCfg();render()},
  padd(){const cs=[...new Set([...prep().map(p=>p.c),'Otros'])];sheet('<h2 style="margin-top:0">Nuevo elemento</h2><label>Categoría</label><select id="pc">'+cs.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select><label>Nombre</label><input id="pn">',()=>{

function pendientes(){
  const n=Date.now(),it=[];
  infos().forEach(i=>{if(i.last&&n-i.last.inicio<864e5)it.push([i.ok?'ok':'warn','Medicación · '+esc(i.p.farmaco),i.ok?'Ya se puede dar otra dosis':'Próxima dosis posible a las '+hm(i.next)])});

  vacList().forEach(v=>{if(v.ok||!v.prev)return;const d=new Date(v.prev+'T12:00'),df=(d-n)/864e5;if(df<30&&df>-60)it.push([df<0?'warn':'acc','Vacuna · '+esc(v.t),(df<0?'Fecha prevista pasada (':'Prevista el ')+d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})+(df<0?')':'')])});

/* Embarazo: cfg.emb=true mientras la fecha de cfg.nac (prevista) no se confirme con «Ya ha nacido».

const nacFut=()=>!!cfg.nac&&new Date(cfg.nac+'T00:00')>new Date();

  '<div class="bar"><i style="width:'+Math.round(sem/40*100)+'%"></i></div><div class="mute" style="margin-top:4px">'+(sem<=40?sem+' de 40 semanas':'Pasada la fecha prevista')+'</div>'+

  '<button class="sec" style="width:100%;padding:14px'+(d<1?';background:var(--acc);color:var(--on)':'')+'" data-a="nacio">Ya ha nacido</button>'+
  (L.length?'<div class="row"><h2>Actividad reciente</h2><button class="lnk" data-a="tab" data-v="his">Ver todo ›</button></div><div class="card" style="padding:2px 14px">'+L.slice(0,4).map(e=>evRow(e,false,true)).join('')+'</div>':'')+pendientes();

  const X=t=>pl+(t-x0)/(x1-x0||1)*(W-pl-pr),Y=v=>H-pb-(v-y0)/(y1-y0)*(H-pb-pt);let g='';
  for(let v=Math.ceil(y0*2)/2;v<=y1;v+=.5)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)"'+(v===38?' stroke-dasharray="4 4" style="stroke:var(--warn)"':'')+'/><text x="'+(pl-4)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+v.toFixed(1)+'</text>';

  return'<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Evolución de la temperatura">'+g+'</svg><div class="mute">Últimos 7 días. La línea discontinua marca 38 °C.</div>';
}

const MET={ml:['Leche'],tomas:['Tomas'],pan:['Pañales'],sue:['Sueño'],sies:['Siestas']};
function dayStats(a){const b=a+864e5,n=Date.now();let ml=0,tomas=0,pan=0,sue=0,sies=0;
  Store.live().forEach(e=>{if(e.tipo==='toma'&&e.inicio>=a&&e.inicio<b){tomas++;ml+=e.datos.ml||0}else if(e.tipo==='panal'&&e.inicio>=a&&e.inicio<b)pan++;else if(e.tipo==='sueno'){const o=Math.min(e.fin||n,b)-Math.max(e.inicio,a);if(o>0)sue+=o;if(e.inicio>=a&&e.inicio<b)sies++}});
  return{ml,tomas,pan,sue:sue/36e5,sies}}
function periodo(off,N){
  const t=Date.now(),B=Store.live().filter(e=>['toma','panal','sueno'].includes(e.tipo)),first=B.length?Math.min(...B.map(e=>e.inicio)):Infinity,days=[];
  for(let i=off+N-1;i>=off;i--){const a=dayStart(t-i*864e5);days.push(Object.assign({a},dayStats(a)))}
  const v=days.filter(d=>d.a+864e5>first),k=v.length||1,S=m=>v.reduce((x,d)=>x+d[m],0)/k;
  return{days,n:v.length,avg:{ml:S('ml'),tomas:S('tomas'),pan:S('pan'),sue:S('sue'),sies:S('sies')}}}
function barSvg(days,m){
  const W=340,H=160,pl=32,pb=22,pt=8,mx=Math.max(...days.map(d=>d[m]),1)*1.1,bw=(W-pl-6)/days.length;let g='';

  days.forEach((d,i)=>{const hh=d[m]/mx*(H-pb-pt),x=pl+i*bw;g+='<rect x="'+(x+bw*.15).toFixed(1)+'" y="'+(H-pb-hh).toFixed(1)+'" width="'+(bw*.7).toFixed(1)+'" height="'+Math.max(hh,0).toFixed(1)+'" rx="3" fill="var(--acc)"'+(i===days.length-1?'':' opacity=".7"')+'/>';
    if(days.length<=7||i%5===4||i===0)g+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="var(--mute)">'+(days.length<=7?new Date(d.a).toLocaleDateString('es-ES',{weekday:'narrow'}).toUpperCase():new Date(d.a).getDate())+'</text>'});
  return'<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gráfico diario">'+g+'</svg>';
}
function vStats(){

  comida(){const hr=new Date().getHours(),def=hr<11?'d':hr<16?'c':hr<19?'m':'n',pm=((cfg.menu||{})[dkey(0)]||{})[def]||'';
    sheet('<h2 style="margin-top:0">Comida</h2>'+chips('cs',SL,def)+'<label>¿Qué ha comido?</label><input id="ct" value="'+esc(pm)+'" placeholder="Ej.: puré de calabaza y pollo"><label>Cómo ha ido</label>'+chips('ca',[['b','Bien'],['r','Poco'],['n','Rechaza']],'b')+'<label>Hora</label><input id="hr" type="time" value="'+nowHM()+'">',()=>{
      const t=$('ct').value.trim();if(!t)return false;addEv('comida',{slot:chipVal('cs'),t,acep:chipVal('ca')},toTs($('hr').value),'Comida registrada')})}
});

/* ===== Reloj: actualiza tiempos sin redibujar ===== */
function tick(){
  const s=state(),n=Date.now();
  if(s.S&&tab!=='hoy'){$('ban').style.display='flex';$('bant').textContent='Durmiendo · '+clock(n-s.S.inicio)}else $('ban').style.display='none';
  if(tab!=='hoy'||!$('wk'))return;
  if($('ago')&&s.last)$('ago').textContent='hace '+dur(n-s.last.inicio);
  if($('pago')&&s.lastPan)$('pago').textContent='hace '+dur(n-s.lastPan.inicio);
  const[lo,hi]=ventana(ageM()),dot=c=>{$('sd').style.background=c;$('sd').style.boxShadow='0 0 0 4px color-mix(in srgb,'+c+' 22%,transparent)'};
  if(s.S){$('wkl').textContent='Durmiendo';$('wk').textContent=clock(n-s.S.inicio);$('wkh').textContent='desde las '+hm(s.S.inicio);$('wbar').style.width='0';dot('#f7c97f')}
  else if(s.lastSleep){
    const mins=(n-s.lastSleep.fin)/60000,p=Math.min(100,mins/hi*100),c=mins>=hi?'var(--hbad,#f29a8d)':mins>=lo?'var(--hwarn,#f2c27d)':'var(--hok,#7fe0c4)';
    $('wkl').textContent='Despierto';$('wk').textContent=dur(n-s.lastSleep.fin);
    $('wkh').textContent=mins>=hi?'Ya pasó su ventana de sueño':mins>=lo?'Buen momento para dormir':'Ventana de sueño: '+lo+'–'+hi+' min';
    $('wbar').style.width=p+'%';$('wbar').style.background=c;dot(c);
  }else{$('wkl').textContent='Estado';$('wk').textContent='Sin siestas aún';$('wkh').textContent='Ventana: '+lo+'–'+hi+' min';$('wbar').style.width='0';dot('#7fe0c4')}
}

/* ===== Familia: tarjeta de Ajustes y autoría en el Resumen ===== */
const porTxt=e=>quien(e)?' · '+esc(quien(e)):'';
function porHoy(L){if(!Sync.on||Sync.miembros.length<2)return'';const t0=dayStart(),c={};L.forEach(e=>{if(e.inicio>=t0&&e.por)c[e.por]=(c[e.por]||0)+1});const k=Object.keys(c);if(!k.length)return'';
  return'<div class="it"><span>Registros de hoy</span><span class="mute" style="text-align:right;max-width:62%">'+k.map(u=>esc(quien({por:u})||'Otro')+': '+c[u]).join(' · ')+'</span></div>'}
function vFam(){
  if(!Sync.on)return'';
  if(!Sync.ready)return'<h2>Familia</h2><div class="card mute">'+esc(Sync.estado)+'</div>';
  const nm=Sync.miembros.map(u=>esc(Sync.nombres[u]||'Sin nombre')+(u===Sync.uid?' (tú)':'')).join(' · ');
  return'<h2>Familia</h2><div class="card"><div class="it"><span>Estado</span><span class="mute" style="text-align:right">'+esc(Sync.estado)+'</span></div>'+
    '<div class="it"><span>Miembros</span><span class="mute" style="text-align:right;max-width:62%">'+nm+'</span></div>'+
    '<div class="it"><span>Código para invitar</span><b style="letter-spacing:2px">'+fmtCod(Sync.fid)+'</b></div>'+
    '<div class="mute" style="margin:6px 0 10px">En el otro móvil: abre Origo, crea su cuenta, pulsa «Me han invitado» y escribe este código.</div>'+
    '<div class="grid"><button class="sec" id="fcp">Copiar código</button><button class="sec" id="fso">Cerrar sesión</button></div>'+
    '<div class="mute" style="margin-top:8px">Sesión: '+esc(Sync.email)+'</div></div>';
}

/* ===== Primer uso ===== */
function onboard(){
  sheet('<div style="text-align:center;margin-bottom:8px"><span style="display:inline-block;background:#f4f7f8;border-radius:16px;padding:10px 18px">'+LOGO(130)+'</span></div><h2 style="margin-top:0;text-align:center">Bienvenidos a Origo</h2><label>Nombre del bebé</label><input id="on" placeholder="Nombre"><label>Fecha de nacimiento (o prevista)</label><input id="of" type="date"><label>Sexo (opcional, para las curvas de la OMS)</label>'+chips('os',[['f','Niña'],['m','Niño']],'')+'',()=>{
    if(!$('on').value.trim()||!$('of').value)return false;
    cfg.nombre=$('on').value.trim();cfg.nac=$('of').value;cfg.sexo=chipVal('os')||cfg.sexo;saveCfg();render()});
  $('shx').style.display='none';
}

theme();render();
if(!cfg.nombre&&!Sync.on)onboard();
setInterval(tick,1000);setInterval(theme,60000);
iniciarFirebase();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
